name: Day_4 CI

on:
  push:
    branches: [ '*' ]
    paths:
    - 'Day_4/**'
  pull_request:
    branches: [ '*' ]
    paths:
    - 'Day_4/**'

jobs:
  build:

    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v4
    - name: Setup MSBuild
      uses: microsoft/setup-msbuild@v1.0.2
    - name: Build with MSBuild
      run: msbuild Day_4/Day_4.vcxproj /p:Configuration=Release
