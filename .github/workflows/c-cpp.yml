name: Day_1 CI

on:
  push:
    branches: [ '*' ]
    paths:
    - 'Day_1/**'
  pull_request:
    branches: [ '*' ]
    paths:
    - 'Day_1/**'

jobs:
  build:

    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v4
    - name: Setup MSBuild
      uses: microsoft/setup-msbuild@v1.0.2
    - name: Build with MSBuild
      run: msbuild AdventofCode.sln /p:Configuration=Release /p:Platform=x64
